server {
    listen 80;
    server_name games.yufon.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name games.yufon.site;

    root /var/www/games;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/wildcard.yufon.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard.yufon.site/key.pem;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # 总站首页：每次都拿最新的版本
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 游戏封面等静态素材
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 具体游戏（子目录，可直接把新游戏丢进 /var/www/games/ 下）
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
